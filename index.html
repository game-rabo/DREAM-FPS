<title>DREAM FPS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#06100f;color:#fff;font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-weight:800}

.tx{text-shadow:-2px -2px 0 #0a2250,2px -2px 0 #0a2250,-2px 2px 0 #0a2250,2px 2px 0 #0a2250,0 3px 0 #0a2250}

.bt.g{background:linear-gradient(#7dff7a,#1fb83a)}.bt.p{background:linear-gradient(#ff9ad5,#e03a9a)}.bt.r{background:linear-gradient(#ff7a7a,#d02323)}.bt.v{background:linear-gradient(#b48aff,#6a35e0)}
.bt:active{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 1px 0 #0a2250}
.bt:disabled{filter:grayscale(.9);opacity:.7}
/* HOME */
#home{background:radial-gradient(120% 70% at 50% 0,#f7c6ff 0,#a9d8ff 40%,#8fe6d4 75%,#6fd0c0 100%);overflow:hidden}
#home:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.35) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.35) 2px,transparent 2px);background-size:46px 46px;transform:perspective(400px) rotateX(55deg) translateY(30%);transform-origin:50% 100%;opacity:.7;top:40%}
.top{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:8px;align-items:center}
.plate{flex:1;background:#1c4fa8;border:4px solid #0a2250;border-radius:12px;padding:4px 10px;min-width:0}
.plate b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plate small{font-size:12px;opacity:.9}
.bar{height:8px;background:#0a2250;border-radius:5px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:linear-gradient(#ffe36b,#ffb81c);width:0}
.coin{background:#1c4fa8;border:4px solid #0a2250;border-radius:12px;padding:8px 10px;font-size:15px;color:#ffe36b;white-space:nowrap}
.ib{position:relative;width:46px;height:46px;font-size:20px;padding:0}

.side{position:absolute;top:calc(92px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:10px}.side.L{left:8px}.side.R{right:8px}
.sb{width:68px;height:68px;font-size:11px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}.sb span{font-size:26px;line-height:1}
.sb em{position:absolute;top:-8px;right:-6px;background:#ff2d55;border:2px solid #0a2250;border-radius:10px;font:800 10px/14px sans-serif;font-style:normal;padding:0 5px}
.stage{pointer-events:none;position:absolute;left:0;right:0;top:calc(90px + env(safe-area-inset-top));bottom:190px;display:flex;align-items:center;justify-content:center}
#av{pointer-events:auto;height:min(100%,380px);filter:drop-shadow(0 14px 8px rgba(0,40,60,.35));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
#av.dance{animation:dance .35s ease-in-out infinite}@keyframes dance{0%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-14px)}100%{transform:rotate(-6deg)}}

.bottom{pointer-events:none;position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px}
.bottom>*{pointer-events:auto}.top,.side,.evbar{z-index:3}.modes{display:flex;gap:6px}.modes .bt{padding:6px 12px;font-size:14px;opacity:.75}.modes .bt.on{opacity:1;background:linear-gradient(#ffe36b,#ffb81c);color:#3a2300;text-shadow:none}
#play{width:min(78%,320px);font-size:30px;padding:10px}

/* MM */

#mmN{font-size:64px}#mmT{font-size:22px}.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:300px}.dots i{width:24px;height:24px;border-radius:6px;border:3px solid #0a2250;background:#2a4a80}.dots i.on{background:#ffd23a}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.grid .card{flex-direction:column;justify-content:center;text-align:center;padding:6px 2px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{background:#0f3070;border:3px dashed #8ab8ff;border-radius:10px;padding:10px 4px;text-align:center;font-size:12px}.slot.on{border-style:solid;border-color:#ffd23a}
.rar{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;border:1px solid #000}
/* HUD */
#hud{position:fixed;inset:0;z-index:5;touch-action:none}
#mini{position:absolute;left:calc(8px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));width:104px;height:104px;border:3px solid #fff;border-radius:10px;background:rgba(0,0,0,.45)}
#alive{position:absolute;left:calc(122px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));background:rgba(0,0,0,.55);padding:4px 10px;border-radius:8px;font-size:15px}
#stormT{position:absolute;left:calc(122px + env(safe-area-inset-left));top:calc(44px + env(safe-area-inset-top));font-size:12px;background:rgba(106,53,224,.7);padding:3px 8px;border-radius:8px}
#feed{position:absolute;left:calc(122px + env(safe-area-inset-left));top:calc(74px + env(safe-area-inset-top));font-size:11px;display:flex;flex-direction:column;gap:2px;max-width:55vw}#feed div{background:rgba(0,0,0,.5);padding:2px 6px;border-radius:5px}

#cross .c{width:3px;height:3px;left:-1.5px;top:-1.5px;border-radius:2px;background:#ff3b3b}
#hm{position:absolute;left:50%;top:44%;width:0;height:0;pointer-events:none;opacity:0}
#hm:before,#hm:after{content:"";position:absolute;width:22px;height:3px;background:#fff;left:-11px;top:-1px;transform:rotate(45deg);box-shadow:0 0 2px #000}#hm:after{transform:rotate(-45deg)}#hm.h:before,#hm.h:after{background:#ff3b3b}
#scope{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 44%,transparent 0,transparent 30vmin,#000 30.5vmin);display:none}
#scope:before{content:"";position:absolute;left:0;right:0;top:44%;height:1px;background:#000}#scope:after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:#000}
#flash,#sfx,#dfx{position:absolute;inset:0;pointer-events:none;opacity:0}
#flash{background:radial-gradient(circle,transparent 40%,rgba(255,0,0,.7))}#sfx{background:radial-gradient(circle,transparent 30%,rgba(140,40,255,.55));opacity:0}#dfx{background:#400;transition:opacity 1s}
#ind{position:absolute;left:50%;top:44%;width:0;height:0;pointer-events:none}#ind i{position:absolute;left:-30px;top:-110px;width:60px;height:14px;background:linear-gradient(transparent,rgba(255,40,40,.9));border-radius:50%;transform-origin:30px 110px;opacity:0}
#bars{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(44vw,200px)}
.hb{height:14px;background:rgba(0,0,0,.6);border:2px solid #fff;border-radius:7px;overflow:hidden;margin-top:3px}.hb i{display:block;height:100%;width:100%}#hp{background:#3ddc4a}#sh{background:#4fb0ff}
#ammo{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:calc(120px + env(safe-area-inset-bottom));font-size:12px;text-align:right;pointer-events:none;display:none}
#ammoN{font-size:26px}
#prog{position:absolute;left:50%;top:56%;transform:translateX(-50%);width:140px;height:10px;background:rgba(0,0,0,.6);border:2px solid #fff;border-radius:6px;display:none;overflow:hidden}#prog i{display:block;height:100%;background:#ffd23a;width:0}
#banner{position:absolute;left:0;right:0;top:28%;text-align:center;font-size:40px;pointer-events:none;opacity:0;transition:opacity .3s}
.hbtn{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.85);background:rgba(20,40,70,.45);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;line-height:1.1;touch-action:none}
.hbtn.on{background:rgba(255,210,58,.65)}.hbtn:active{background:rgba(255,255,255,.4)}.hbtn.act{background:rgba(255,80,80,.55)}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);pointer-events:none;display:none}#joy i{position:absolute;left:32px;top:32px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.55)}
#slots{position:absolute;right:calc(8px + env(safe-area-inset-right));top:calc(150px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px}
#slots .hbtn{position:relative;width:58px;height:42px;border-radius:10px;font-size:10px}
#wheel{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:none;grid-template-columns:repeat(3,64px);gap:8px;background:rgba(0,0,0,.6);padding:10px;border-radius:14px}#wheel button{font-size:28px;height:60px;border-radius:12px;border:3px solid #fff;background:#1c4fa8}
#spec{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom));display:none;justify-content:center;gap:10px;align-items:center}
#hint{position:absolute;left:0;right:0;top:62%;text-align:center;font-size:13px;pointer-events:none;text-shadow:0 0 4px #000}
#toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}#toast div{background:#0a2250;border:3px solid #ffd23a;border-radius:10px;padding:6px 12px;font-size:14px;animation:tin .25s}@keyframes tin{from{transform:translateY(-12px);opacity:0}}
#res{background:linear-gradient(#0e2a5a,#2f86ee);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
#resP{font-size:60px}
#rot{position:fixed;top:0;left:0;right:0;background:#ffd23a;color:#3a2300;text-align:center;font-size:12px;padding:3px;z-index:200;display:none}@media (orientation:landscape){#rot{display:block}}

#gl{filter:saturate(.88) contrast(1.06) sepia(.2) hue-rotate(-10deg) brightness(1.05)}
#dream{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 55%,rgba(255,170,200,.28) 100%),repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);mix-blend-mode:screen;animation:dr 6s ease-in-out infinite}@keyframes dr{50%{opacity:.7}}
#home{background:linear-gradient(160deg,#2a63e8 0%,#1c3fb0 55%,#7a2ad0 100%)!important}
#home::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 36px,transparent 36px 72px);pointer-events:none}
.bt{font-family:'Lilita One','Arial Black',Impact,sans-serif;font-weight:900;letter-spacing:.5px;border:3px solid #0a1230!important;border-radius:12px!important;box-shadow:0 5px 0 #0a1230,inset 0 3px 0 rgba(255,255,255,.35)!important;text-shadow:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000,0 2px 0 #000}

#play{font-size:36px!important;padding:12px 46px!important;border-radius:14px!important;min-width:200px;transform:skew(-4deg)}

.coin{background:rgba(10,18,48,.75)!important;border:3px solid #000!important;border-radius:20px!important;color:#ffd84a!important;text-shadow:0 2px 0 #000;font-family:'Lilita One','Arial Black',sans-serif}
.sb{background:linear-gradient(#4a86ff,#2a52c8)!important;color:#fff!important}
.evbar{background:linear-gradient(#ffe44a,#ffb800)!important;color:#fff!important;border:3px solid #000;border-radius:10px;text-shadow:0 2px 0 #000}
#modal .mbox{background:linear-gradient(#2f5fe0,#1d3aa8)!important;border:4px solid #000!important;border-radius:16px!important;box-shadow:0 8px 0 #000!important;color:#fff}
#modal .mh{background:linear-gradient(#4a8cff,#2f5fe0)!important;border-bottom:4px solid #000;font-family:'Lilita One','Arial Black',sans-serif;text-shadow:0 2px 0 #000;color:#fff}
#modal .card{background:linear-gradient(#27428f,#1d3280)!important;border:3px solid #0a1230!important;border-radius:12px!important;color:#fff}

#modal{display:flex;justify-content:flex-end;align-items:stretch;background:rgba(0,10,40,.55)}
#modal .mbox{width:min(100%,520px)!important;max-height:none!important;height:100%;border-radius:0!important;border-width:0 0 0 4px!important;animation:slin .3s cubic-bezier(.2,.9,.3,1)}@keyframes slin{from{transform:translateX(100%)}}
#modal .mh{display:flex;align-items:center;gap:10px;font-size:22px;padding:8px 10px}#modal .mh>span:nth-child(2){flex:1}
.bk{padding:4px 8px!important;display:flex}.bk svg{width:24px;height:24px}
.hc{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.45);border:3px solid #000;border-radius:16px;padding:2px 10px;font-size:16px;color:#ffd84a}
.ic svg,.hc svg{width:22px;height:22px;vertical-align:middle}.sb svg{width:34px;height:34px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.tb{flex:0 0 auto;padding:6px 14px;border:3px solid #000;border-radius:10px;background:#1d3280;color:#fff;font-family:inherit;font-weight:900;font-size:14px}.tb.on{background:linear-gradient(#ffe44a,#ffb800);color:#fff;text-shadow:0 2px 0 #000}

.pi{width:100%;border:3px solid #000;border-radius:10px;padding:8px 0}.pi svg{width:78%;height:46px}
.pb{width:100%;padding:6px 0;border:3px solid #000;border-radius:10px;background:linear-gradient(#5fe03a,#25a818);color:#fff;font-family:inherit;font-weight:900;font-size:16px;text-shadow:0 2px 0 #000;box-shadow:0 4px 0 #0a4a08;display:flex;align-items:center;justify-content:center;gap:4px}.pb svg{width:20px;height:20px}

<div id="dream"></div><div id="home" class="scr">
 <div class="top">

/* ================= AUDIO（リアル系のみ） ================= */
let AC,NB;
function aud(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(AC.state==='suspended')AC.resume()}catch(e){}}
function noise(ft,fr,dur,vol,pan){if(!AC||S.mute||vol<=.01)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=ft;f.frequency.value=fr;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);let o=g;if(AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=cl(pan||0,-1,1);g.connect(p);o=p}o.connect(AC.destination);s.start(t,Math.random()*.4);s.stop(t+dur+.02)}
function thump(vol,pan){if(!AC||S.mute||vol<=.01)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(40,t+.1);g.gain.setValueAtTime(vol*.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.14)}
const SND={pistol:[3500,.12],smg:[3000,.09],ar:[2500,.15],sg:[1500,.3],sn:[1200,.5],dmr:[1800,.3],lmg:[1900,.17]};
function shotSnd(w,v,pan){const c=SND[w.t];noise('lowpass',c[0],c[1],.7*v,pan);thump(v,pan)}
const stepSnd=v=>noise('lowpass',380,.09,.3*v);
let hum=null;function humOn(on){if(!AC||S.mute)return;if(on&&!hum){const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=140;const g=AC.createGain();g.gain.value=.05;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();hum=s}else if(!on&&hum){try{hum.stop()}catch(e){}hum=null}}

function pauseMenu(){if(!G)return;G.paused=1;G.pm=1;modal('⏸ ポーズ','<button class="bt g" data-r="1">再開</button><button class="bt" data-n="1">🔔 通知</button><button class="bt r" data-q="1">試合を退出</button>',e=>{if(e.target.closest('[data-r]'))closeModal();if(e.target.closest('[data-n]'))MODALS.note();if(e.target.closest('[data-q]')){closeModal();if(P.alive)kill(P,null,null,0,'退出');else finish()}})}

/* ================= RESULT ================= */
function finish(){if(!G||G.fin)return;G.fin=1;humOn(false);$('#hud').classList.add('hide');cv.style.display='none';$('#wheel').style.display='none';K.fire=K.fire2=0;J.x=J.y=0;joy.style.display='none';Object.keys(pts).forEach(k=>delete pts[k]);$('#cross').style.display='block';
 const pl=P.alive?1:(P.place||G.total),real=!!G.ev&&G.evReal,xm=real?2:1,cm=real?(G.ev.gold?3:1.5):1;
 const pb=pl===1?1500:pl===2?800:pl===3?500:pl<=5?250:100,xb=pl===1?400:pl===2?250:pl===3?180:pl<=5?100:40;
 if(pl<=3)S.streak++;else S.streak=0;const sm=1+.1*Math.min(S.streak,5)-(pl<=3?0:0);
 let coins=Math.round((G.kills*100+pb+G.coinB)*cm*sm),xp=Math.round((G.kills*60+xb+Math.min(120,G.t/3))*xm);
 S.matches++;S.kills+=G.kills;if(pl===1)S.wins++;S.coins+=coins;addXP(xp);track('m',1);if(pl===1)track('w',1);if(pl<=3)track('t',1);
 // CPU学習（成績に合わせて難易度調整）
 if(!G.priv){if(pl<=3)S.ai=Math.min(1.6,S.ai+.08);else if(pl>=7)S.ai=Math.max(.6,S.ai-.08)}
 S.learn.push({p:pl,k:G.kills,hs:G.hs,t:Math.round(G.t)});S.learn=S.learn.slice(-20);save();sbSync();sbLearn({placement:pl,kills:G.kills,headshots:G.hs,duration:Math.round(G.t),event:G.ev?G.ev.n:null});
 const r=$('#res');r.classList.remove('hide');uiMode='res';
 r.innerHTML=`<div id="resP" class="tx">${pl===1?'🏆 1位':'#'+pl}</div><div class="tx" style="font-size:18px">${pl===1?'ビクトリーロイヤル！':'お疲れさま！'}</div>
 <div class="card" style="display:block;min-width:260px;text-align:left"><div>キル：${G.kills}　ヘッドショット：${G.hs}</div><div>🪙 コイン：+${fmt(coins)}${sm>1?'（連続入賞×'+sm.toFixed(1)+'）':''}</div><div>XP：+${xp}${real?'（イベントXP×2）':''}</div><div>連続入賞：${S.streak}回</div></div>
 <div class="card" style="min-width:260px"><span>ボーナスルーレット</span><b id="rl" style="font-size:26px">×?</b><button class="bt p" id="rb">回す！</button></div>
 <button class="bt y" id="rh" style="font-size:22px;min-width:200px">ホームへ</button>`;
 $('#rb').onclick=function(){this.disabled=true;const v=[1,1,1,1,2,2,2,3,3,5],f=[1,2,3,5];let i=0,iv=setInterval(()=>{$('#rl').textContent='×'+f[i++%4]},80);setTimeout(()=>{clearInterval(iv);const m=pick(v);$('#rl').textContent='×'+m;if(m>1){const ex=coins*(m-1);S.coins+=ex;save();toast('ボーナス +'+fmt(ex)+'🪙')}},1300)};
 $('#rh').onclick=()=>{r.classList.add('hide');$('#home').classList.remove('hide');uiMode='home';homeUpd();dailyInit()};
 // cleanup meshes
 for(const b of G.bots){SC.remove(b.m.g)}for(const d of G.drops)removeDrop(d);stormM.visible=false;const gg=G;G=null;gg.all=[]}

/* ================= LOOP ================= */
let last=0;
function frame(ts){avTick(ts);requestAnimationFrame(frame);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(MOTE){const a=MOTE.a;for(let i=1;i<a.length;i+=3){a[i]+=dt*.9;if(a[i]>32)a[i]=.5}MOTE.g.attributes.position.needsUpdate=true}if(WTX)WTX.offset.set(WTX.offset.x+dt*.012,WTX.offset.y+dt*.008);if(!G||!R)return;if(!G.paused&&!G.fin)step(dt);if(G&&!G.fin)R.render(SC,CAM)}
requestAnimationFrame(frame);
// boot
dailyInit();homeUpd();evTick();sbSync();
if(S.login.last!==today())setTimeout(()=>notify('ログインボーナスが受け取れます！'),600);
addEventListener('beforeunload',save);
</script>
</body>
</html>
